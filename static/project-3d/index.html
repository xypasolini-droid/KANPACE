<body>
<header class="page-header"><a id="back" href="/">← 图纸拆单</a><div><strong>KANPACE</strong><span id="project-name">清单尺寸示意</span></div><a id="upload" href="/model/index.html">查看工程模型 ↗</a></header>
<main id="workspace">
  <div class="toolbar"><label>柜型<select id="cabinet-select" aria-label="选择预览柜型"><option value="">全部柜型</option></select></label><div class="views" aria-label="三维视角"><button data-view="iso" aria-pressed="true">立体</button><button data-view="front" aria-pressed="false">正面</button><button data-view="back" aria-pressed="false">背面</button><button data-view="right" aria-pressed="false">侧面</button><button data-view="top" aria-pressed="false">俯视</button></div><button id="fit" title="适应窗口">适应</button></div>

    <div class="mode-note"><span>清单尺寸示意</span><small>按尺寸生成，未读取原设计模型</small></div>
